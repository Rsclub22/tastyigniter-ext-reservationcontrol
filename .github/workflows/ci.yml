name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]

    # composer.json allows ^8.3, so 8.4 is a promise this package makes. It is
    # reported but does not block: a break there is worth knowing about without
    # holding up work that targets the version the extension actually runs on.
    continue-on-error: ${{ matrix.php == '8.4' }}

    services:
      db:
        # Docker Hub throttles unauthenticated pulls, and every run pulls this
        # once per matrix entry - which is how a green pipeline turned into
        # 'toomanyrequests' on a busy evening. AWS's public registry mirrors
        # the Docker Official Images and needs no credentials.
        image: public.ecr.aws/docker/library/mariadb:10.11
        env:
          MARIADB_DATABASE: testbench
          MARIADB_USER: forge
          MARIADB_PASSWORD: forge
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=30

    env:
      # Read by orchestra/testbench, same as docker-compose.dev.yml.
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: testbench
      DB_USERNAME: forge
      DB_PASSWORD: forge

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, zip, gd, bcmath, pdo_mysql
          # PHPStan analyses in child processes and hands them its own limit.
          # At the 128M default those children die with "Child process error
          # (exit code 255)" before a single error is reported. Same reason as
          # the ini file in Dockerfile.dev - keep the two in step.
          ini-values: memory_limit=1G
          coverage: none

      # No composer.lock is committed (this is a library), so dependencies
      # resolve fresh on every run. That is deliberate: it catches an upstream
      # release breaking the extension on the day it happens, not months later.
      - uses: ramsey/composer-install@v3

      - name: Tests
        run: vendor/bin/pest

      # Style and static analysis do not depend on the PHP version under test,
      # so they run once instead of once per matrix entry.
      - name: Code style
        if: matrix.php == '8.3'
        run: vendor/bin/pint --test

      - name: Static analysis
        if: matrix.php == '8.3'
        run: vendor/bin/phpstan analyse --no-progress
