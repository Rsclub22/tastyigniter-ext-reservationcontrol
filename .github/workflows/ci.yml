name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: PHP ${{ matrix.php }}
    # Pinned, not ubuntu-latest: MariaDB comes from this release's archive
    # (10.11, the version the server runs). A newer image would quietly move
    # the tests to a different major version.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]

    # composer.json allows ^8.3, so 8.4 is a promise this package makes. It is
    # reported but does not block: a break there is worth knowing about without
    # holding up work that targets the version the extension actually runs on.
    continue-on-error: ${{ matrix.php == '8.4' }}

    env:
      # Read by orchestra/testbench, same as docker-compose.dev.yml.
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: testbench
      DB_USERNAME: forge
      DB_PASSWORD: forge

    steps:
      - uses: actions/checkout@v7

      # MariaDB is installed from Ubuntu's archive rather than run as a service
      # container. Both registries tried so far throttle anonymous pulls per
      # source IP - Docker Hub by count, AWS's public mirror by volume - and
      # GitHub's runners share their IPs, so both ended in 'toomanyrequests'
      # with nothing wrong in the code. The archive sits on Azure's own mirror
      # and has no such limit. The runner's preinstalled MySQL has to go first:
      # the packages conflict, and MariaDB will not start on its data dir.
      - name: MariaDB
        run: |
          sudo systemctl stop mysql
          sudo apt-get purge -y -q 'mysql-*'
          sudo rm -rf /var/lib/mysql /etc/mysql
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mariadb-server
          sudo mariadb -e "SELECT VERSION()"
          sudo mariadb -e "CREATE DATABASE testbench; CREATE USER 'forge'@'%' IDENTIFIED BY 'forge'; GRANT ALL ON testbench.* TO 'forge'@'%';"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, zip, gd, bcmath, pdo_mysql
          # PHPStan analyses in child processes and hands them its own limit.
          # At the 128M default those children die with "Child process error
          # (exit code 255)" before a single error is reported. Same reason as
          # the ini file in Dockerfile.dev - keep the two in step.
          ini-values: memory_limit=1G
          coverage: none

      # No composer.lock is committed (this is a library), so dependencies
      # resolve fresh on every run. That is deliberate: it catches an upstream
      # release breaking the extension on the day it happens, not months later.
      - uses: ramsey/composer-install@v3

      - name: Tests
        run: vendor/bin/pest

      # Style and static analysis do not depend on the PHP version under test,
      # so they run once instead of once per matrix entry.
      - name: Code style
        if: matrix.php == '8.3'
        run: vendor/bin/pint --test

      - name: Static analysis
        if: matrix.php == '8.3'
        run: vendor/bin/phpstan analyse --no-progress
