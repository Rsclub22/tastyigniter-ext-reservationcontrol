# Development-only. Not needed to run the extension in production.
services:
  php:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
      # Read by orchestra/testbench; phpunit.xml.dist must not override them.
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: testbench
      DB_USERNAME: forge
      DB_PASSWORD: forge
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: testbench
      MARIADB_USER: forge
      MARIADB_PASSWORD: forge
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/mysql
